<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>headlinecheck options</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 34rem; margin: 2rem auto; padding: 0 1rem; }
  label { display: block; margin-top: 1rem; font-weight: 600; }
  input[type=number], select, textarea { font: inherit; width: 100%; box-sizing: border-box; margin-top: .25rem; }
  small { color: #555; font-weight: 400; }
  button { font: inherit; margin-top: 1.25rem; padding: .4rem 1rem; }
  #status { margin-left: .75rem; }
</style>
</head>
<body>
<h1>headlinecheck</h1>
<label>Threshold
  <input id="threshold" type="number" min="0.5" max="10" step="0.5">
  <small>Headlines scoring at or above this are marked. 4 is high, 2 is medium.</small>
</label>
<label>How to mark
  <select id="mode">
    <option value="dim">Dim the headline</option>
    <option value="badge">Add a score badge</option>
  </select>
</label>
<label>Sites to skip
  <textarea id="hosts" rows="4" placeholder="one domain per line, e.g. example.com"></textarea>
</label>
<button id="save">Save</button><span id="status" role="status"></span>
<script src="options.js"></script>
</body>
</html>
